name: Build release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - darwin
          - linux
        goarch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          artifact="sloop-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${artifact}"
          go build -trimpath -ldflags="-s -w" -o "dist/${artifact}/sloop" ./cmd/sloop
          tar -C "dist/${artifact}" -czf "dist/${artifact}.tar.gz" sloop

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sloop-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

